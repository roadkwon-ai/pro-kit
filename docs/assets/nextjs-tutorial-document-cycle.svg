<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>한 기능을 완성할 때마다 코드와 문서를 함께 맞춥니다</title>
  <desc>프로젝트 개관과 용어집을 읽고 한 기능을 구현합니다. 동작 검증에 실패하면 구현으로 돌아가고, 성공하면 문서를 갱신하고 진행 상태를 기록합니다.</desc>
  <style>
    svg{--bg:#fff;--ink:#1f2733;--muted:#5b6675;--hair:#d6e0ec;--primary:#1f6fb2;--band:#f4f8fc;--good:#0f7a5f;--good-tint:#e7f5ef;--warn:#9a5b12;--doc:#e8f1fb}
    .ink{fill:var(--ink)}.muted{fill:var(--muted)}.on-accent{fill:#fff}
    .card{fill:var(--bg);stroke:var(--hair);stroke-width:1.5}
    .title{font-size:22px;font-weight:700}.body{font-size:18px}.caption{font-size:17px}
    .flow{fill:none;stroke:var(--primary);stroke-width:2.5;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11.25" markerHeight="11.25" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#1f6fb2" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <symbol id="doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 10h5M9 14h6M9 18h6"/></symbol>
  </defs>
  <rect width="1400" height="760" fill="var(--bg)"/>
  <rect x="40" y="40" width="6" height="48" rx="3" fill="var(--primary)"/>
  <text x="66" y="75" class="ink" font-size="40" font-weight="700">한 기능을 완성할 때마다 코드와 문서를 함께 맞춥니다</text>
  <text x="66" y="115" class="muted" font-size="20">Better Tasks Lab · 작업을 시작할 때 읽고, 바뀐 내용을 검증한 뒤 기록합니다</text>
  <rect x="40" y="155" width="1320" height="250" rx="20" fill="var(--band)" stroke="var(--hair)"/>
  <rect x="60" y="185" width="240" height="190" rx="12" class="card"/>
  <rect x="400" y="185" width="240" height="190" rx="12" class="card"/>
  <rect x="740" y="185" width="240" height="190" rx="12" class="card"/>
  <rect x="1080" y="185" width="240" height="190" rx="12" fill="var(--good-tint)" stroke="var(--good)" stroke-width="2"/>
  <g text-anchor="middle" dominant-baseline="central">
    <circle cx="180" cy="223" r="21" fill="var(--primary)"/><text text-anchor="middle" x="180" y="223" class="on-accent" font-size="21" font-weight="700">1</text>
    <circle cx="520" cy="223" r="21" fill="var(--primary)"/><text text-anchor="middle" x="520" y="223" class="on-accent" font-size="21" font-weight="700">2</text>
    <circle cx="860" cy="223" r="21" fill="var(--primary)"/><text text-anchor="middle" x="860" y="223" class="on-accent" font-size="21" font-weight="700">3</text>
    <circle cx="1200" cy="223" r="21" fill="var(--good)"/><text text-anchor="middle" x="1200" y="223" class="on-accent" font-size="21" font-weight="700">4</text>
    <text text-anchor="middle" x="180" y="269" class="title ink">기준 문서 읽기</text>
    <text text-anchor="middle" x="180" y="308" class="body muted">용어 · 범위 · 현재 단계</text>
    <text text-anchor="middle" x="180" y="339" class="body muted">이번 완료 조건 확인</text>
    <text text-anchor="middle" x="520" y="269" class="title ink">한 기능 구현하기</text>
    <text text-anchor="middle" x="520" y="308" class="body muted">명령과 프롬프트 실행</text>
    <text text-anchor="middle" x="520" y="339" class="body muted">작은 범위로 변경</text>
    <text text-anchor="middle" x="860" y="269" class="title ink">실제 동작 검증하기</text>
    <text text-anchor="middle" x="860" y="308" class="body muted">화면 · API · 저장 결과</text>
    <text text-anchor="middle" x="860" y="339" class="body muted">계정 간 접근도 확인</text>
    <text text-anchor="middle" x="1200" y="269" class="title ink">문서와 진행표 갱신</text>
    <text text-anchor="middle" x="1200" y="308" class="body muted">바뀐 정의와 구조 반영</text>
    <text text-anchor="middle" x="1200" y="339" class="body muted">다음 시작 지점 기록</text>
  </g>
  <path d="M310 280 H390" class="flow"/>
  <path d="M650 280 H730" class="flow"/>
  <path d="M990 280 H1070" class="flow"/>
  <path d="M860 385 V447 H520 V385" class="flow" stroke-dasharray="5 4"/>
  <text x="690" y="480" text-anchor="middle" class="caption muted">검증 실패 → 원인을 확인하고 수정</text>
  <rect x="60" y="520" width="610" height="135" rx="14" fill="var(--band)" stroke="var(--hair)"/>
  <rect x="730" y="520" width="590" height="135" rx="14" fill="var(--band)" stroke="var(--hair)"/>
  <circle cx="116" cy="587.5" r="34" fill="var(--doc)"/><use href="#doc" x="96" y="567.5" width="40" height="40" style="color:#1f6fb2"/>
  <circle cx="786" cy="587.5" r="34" fill="var(--doc)"/><use href="#doc" x="766" y="567.5" width="40" height="40" style="color:#1f6fb2"/>
  <text x="170" y="560" class="title ink">glossary.md · 용어의 기준</text>
  <text x="170" y="595" class="body muted">한글 · 영문 · 정의 · 코드와 테이블 매핑</text>
  <text x="170" y="627" class="body muted">새 용어를 정하거나 이름을 바꿀 때 갱신</text>
  <text x="840" y="560" class="title ink">project.md · 서비스의 기준</text>
  <text x="840" y="595" class="body muted">사용 흐름 · URL · 모델 · 9개 역량</text>
  <text x="840" y="627" class="body muted">기능 · 구조 · 권한이 바뀔 때 갱신</text>
  <text x="60" y="701" class="caption muted">실선: 다음 단계 · 점선: 실패 후 수정 · 문서 변경이 없으면 진행표에 이유를 남깁니다</text>
  <text x="60" y="731" class="caption muted">설계안 2026-09-20 · 코드와 문서의 의미가 일치하는지는 검토와 검증으로 확인합니다</text>
</svg>
