<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 582" width="620" height="582" role="img" style="font-family:Pretendard,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>프리셋 팩을 어느 장에서 쓰나요</title>
  <desc>프리셋 팩 파일과 쓰는 장의 짝이다. screens.md는 2장, 3장, 4장, features.md는 2장, design-notes.md와 wireframes 폴더는 3장, data 폴더와 images 폴더는 4장에서 쓴다. features.md의 각 절은 프로필 5장, 작품 6장, 검색 7장, 찜 8장, 평가 9장, 재생과 이어 보기 10장에서 쓴다.</desc>
  <rect data-fill-role="canvas" fill="#F2F2F2" x="0" y="0" width="620" height="582"/>
  <rect data-fill-role="focus" fill="#070707" x="28" y="28" width="3" height="38" rx="1.5"/>
  <text data-fill-role="ink" fill="#070707" x="41" y="47" font-size="22" font-weight="700" dominant-baseline="central">프리셋 팩을 어느 장에서 쓰나요</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="41" y="81" font-size="13" dominant-baseline="central">파일마다 쓰는 장이 정해져 있어요</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" x="28" y="108" width="564" height="288" rx="14"/>
  <text data-fill-role="muted" fill="#6B6B6B" x="44" y="132" font-size="13" font-weight="700" dominant-baseline="central">2~4장: 기획, 디자인, 화면</text>
  <rect data-fill-role="surface-tint" fill="#FFF4BE" x="40" y="150" width="190" height="40" rx="10"/>
  <text data-fill-role="ink" fill="#070707" x="56" y="170" font-size="15" font-weight="700" dominant-baseline="central">screens.md</text>
  <path data-stroke-role="external-line" stroke="#A2A2A9" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M240 170 H262 M257 165 L262 170 L257 175"/>
  <text data-fill-role="ink" fill="#070707" x="276" y="160" font-size="15" font-weight="700" dominant-baseline="central">2장 기획 · 3장 디자인 · 4장 화면</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="276" y="181" font-size="13" dominant-baseline="central">사이트맵과 화면 배치에 써요</text>
  <rect data-fill-role="surface-tint" fill="#FFF4BE" x="40" y="198" width="190" height="40" rx="10"/>
  <text data-fill-role="ink" fill="#070707" x="56" y="218" font-size="15" font-weight="700" dominant-baseline="central">features.md</text>
  <path data-stroke-role="external-line" stroke="#A2A2A9" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M240 218 H262 M257 213 L262 218 L257 223"/>
  <text data-fill-role="ink" fill="#070707" x="276" y="208" font-size="15" font-weight="700" dominant-baseline="central">2장 기획</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="276" y="229" font-size="13" dominant-baseline="central">기능 규칙을 읽고 기획을 채워요</text>
  <rect data-fill-role="surface-tint" fill="#FFF4BE" x="40" y="246" width="190" height="40" rx="10"/>
  <text data-fill-role="ink" fill="#070707" x="56" y="266" font-size="15" font-weight="700" dominant-baseline="central">design-notes.md</text>
  <path data-stroke-role="external-line" stroke="#A2A2A9" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M240 266 H262 M257 261 L262 266 L257 271"/>
  <text data-fill-role="ink" fill="#070707" x="276" y="256" font-size="15" font-weight="700" dominant-baseline="central">3장 디자인</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="276" y="277" font-size="13" dominant-baseline="central">DESIGN.md 받을 주소와 고칠 점</text>
  <rect data-fill-role="surface-tint" fill="#FFF4BE" x="40" y="294" width="190" height="40" rx="10"/>
  <text data-fill-role="ink" fill="#070707" x="56" y="314" font-size="15" font-weight="700" dominant-baseline="central">wireframes/</text>
  <path data-stroke-role="external-line" stroke="#A2A2A9" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M240 314 H262 M257 309 L262 314 L257 319"/>
  <text data-fill-role="ink" fill="#070707" x="276" y="304" font-size="15" font-weight="700" dominant-baseline="central">3장 디자인</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="276" y="325" font-size="13" dominant-baseline="central">화면 배치도를 따라 만들어요</text>
  <rect data-fill-role="surface-tint" fill="#FFF4BE" x="40" y="342" width="190" height="40" rx="10"/>
  <text data-fill-role="ink" fill="#070707" x="56" y="362" font-size="15" font-weight="700" dominant-baseline="central">data/ · images/</text>
  <path data-stroke-role="external-line" stroke="#A2A2A9" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M240 362 H262 M257 357 L262 362 L257 367"/>
  <text data-fill-role="ink" fill="#070707" x="276" y="352" font-size="15" font-weight="700" dominant-baseline="central">4장 화면</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="276" y="373" font-size="13" dominant-baseline="central">예시 데이터와 그림으로 만들어요</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" x="28" y="412" width="564" height="142" rx="14"/>
  <rect data-fill-role="surface-tint" fill="#FFF4BE" x="40" y="426" width="190" height="28" rx="8"/>
  <text data-fill-role="ink" fill="#070707" x="56" y="440" font-size="15" font-weight="700" dominant-baseline="central">features.md의 각 절</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="244" y="440" font-size="13" dominant-baseline="central">5~10장에서 기능마다 하나씩 써요</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" x="40" y="468" width="176" height="32" rx="8"/>
  <text data-fill-role="ink" fill="#070707" x="52" y="484" font-size="14" font-weight="700" dominant-baseline="central">프로필</text>
  <text data-fill-role="edge-ink" fill="#D6203B" x="204" y="484" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="central">5장</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" x="224" y="468" width="176" height="32" rx="8"/>
  <text data-fill-role="ink" fill="#070707" x="236" y="484" font-size="14" font-weight="700" dominant-baseline="central">작품</text>
  <text data-fill-role="edge-ink" fill="#D6203B" x="388" y="484" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="central">6장</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" x="408" y="468" width="176" height="32" rx="8"/>
  <text data-fill-role="ink" fill="#070707" x="420" y="484" font-size="14" font-weight="700" dominant-baseline="central">검색</text>
  <text data-fill-role="edge-ink" fill="#D6203B" x="572" y="484" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="central">7장</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" x="40" y="508" width="176" height="32" rx="8"/>
  <text data-fill-role="ink" fill="#070707" x="52" y="524" font-size="14" font-weight="700" dominant-baseline="central">찜</text>
  <text data-fill-role="edge-ink" fill="#D6203B" x="204" y="524" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="central">8장</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" x="224" y="508" width="176" height="32" rx="8"/>
  <text data-fill-role="ink" fill="#070707" x="236" y="524" font-size="14" font-weight="700" dominant-baseline="central">평가</text>
  <text data-fill-role="edge-ink" fill="#D6203B" x="388" y="524" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="central">9장</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" x="408" y="508" width="176" height="32" rx="8"/>
  <text data-fill-role="ink" fill="#070707" x="420" y="524" font-size="14" font-weight="700" dominant-baseline="central">재생과 이어 보기</text>
  <text data-fill-role="edge-ink" fill="#D6203B" x="572" y="524" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="central">10장</text>
</svg>