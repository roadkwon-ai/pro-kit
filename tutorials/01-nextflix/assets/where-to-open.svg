<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 398" width="620" height="398" role="img" style="font-family:Pretendard,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>에이전트는 두 곳에서 열어요</title>
  <desc>작업 폴더 ~/projects 안에 pro-kit과 새 프로젝트 nextflix가 나란히 있고, 프리셋 팩은 pro-kit 안의 packs/nextflix에 받는다. 1단계에서 작업 폴더에서 에이전트를 열어 프롬프트를 보내고, 3단계에서 알려 준 한 줄로 새 프로젝트 폴더에서 다시 연다.</desc>
  <rect data-fill-role="canvas" fill="#F2F2F2" x="0" y="0" width="620" height="398"/>

  <!-- 머리: 제목 줄 상자(34~60) ± 5.5 → 제목선 28~66 -->
  <rect data-fill-role="focus" fill="#070707" x="28" y="28" width="3" height="38" rx="1.5"/>
  <text data-fill-role="ink" fill="#070707" x="41" y="47" font-size="22" font-weight="700" dominant-baseline="central">에이전트는 두 곳에서 열어요</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="41" y="81" font-size="13" dominant-baseline="central">작업 폴더에서는 프로젝트를, 새 프로젝트 폴더에서는 화면을 만들어요</text>

  <!-- 폴더 판: x 28~592, y 114~370, 안쪽 여백 12, 줄 높이 58(가운데 155·213·271·329) -->
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1" x="28" y="114" width="564" height="256" rx="14"/>
  <rect data-fill-role="surface-tint" fill="#FFF4BE" x="40" y="130" width="540" height="50" rx="10"/>
  <rect data-fill-role="surface-tint" fill="#FFF4BE" x="40" y="304" width="540" height="50" rx="10"/>

  <!-- 나무 선 -->
  <path data-stroke-role="external-line" stroke="#A2A2A9" stroke-width="1.5" fill="none" stroke-linecap="round" d="M60 166 V329 M60 213 H77 M60 329 H77 M92 224 V271 M92 271 H109"/>

  <!-- 폴더 아이콘(24 격자 → 22px) -->
  <g transform="translate(49 144) scale(0.9167)">
    <path data-stroke-role="edge-line" stroke="#070707" stroke-width="1.8" fill="none" stroke-linejoin="round" d="M3 7 A2 2 0 0 1 5 5 H9.5 L11.5 7.5 H19 A2 2 0 0 1 21 9.5 V17 A2 2 0 0 1 19 19 H5 A2 2 0 0 1 3 17 Z"/>
  </g>
  <g transform="translate(81 202) scale(0.9167)">
    <path data-stroke-role="edge-line" stroke="#070707" stroke-width="1.8" fill="none" stroke-linejoin="round" d="M3 7 A2 2 0 0 1 5 5 H9.5 L11.5 7.5 H19 A2 2 0 0 1 21 9.5 V17 A2 2 0 0 1 19 19 H5 A2 2 0 0 1 3 17 Z"/>
  </g>
  <g transform="translate(113 260) scale(0.9167)">
    <path data-stroke-role="edge-line" stroke="#070707" stroke-width="1.8" fill="none" stroke-linejoin="round" d="M3 7 A2 2 0 0 1 5 5 H9.5 L11.5 7.5 H19 A2 2 0 0 1 21 9.5 V17 A2 2 0 0 1 19 19 H5 A2 2 0 0 1 3 17 Z"/>
  </g>
  <g transform="translate(81 318) scale(0.9167)">
    <path data-stroke-role="edge-line" stroke="#070707" stroke-width="1.8" fill="none" stroke-linejoin="round" d="M3 7 A2 2 0 0 1 5 5 H9.5 L11.5 7.5 H19 A2 2 0 0 1 21 9.5 V17 A2 2 0 0 1 19 19 H5 A2 2 0 0 1 3 17 Z"/>
  </g>

  <!-- 폴더 이름(가운데 −10)과 설명(가운데 +11) -->
  <text data-fill-role="ink" fill="#070707" x="82" y="145" font-size="15" font-weight="700" dominant-baseline="central">~/projects</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="82" y="166" font-size="13" dominant-baseline="central">작업 폴더</text>
  <text data-fill-role="ink" fill="#070707" x="114" y="203" font-size="15" font-weight="700" dominant-baseline="central">pro-kit</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="114" y="224" font-size="13" dominant-baseline="central">에이전트가 받아 와요</text>
  <text data-fill-role="ink" fill="#070707" x="146" y="261" font-size="15" font-weight="700" dominant-baseline="central">packs/nextflix</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="146" y="282" font-size="13" dominant-baseline="central">프리셋 팩. 에이전트가 받아 와요</text>
  <text data-fill-role="ink" fill="#070707" x="114" y="319" font-size="15" font-weight="700" dominant-baseline="central">nextflix</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="114" y="340" font-size="13" dominant-baseline="central">새 프로젝트</text>

  <!-- 여는 곳 표시: 터미널 아이콘(24 격자 → 18px) + 제목·설명 -->
  <circle data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1" cx="334" cy="155" r="15"/>
  <g transform="translate(325 146) scale(0.75)">
    <path data-stroke-role="edge-line" stroke="#070707" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M5.5 4 H18.5 A2.5 2.5 0 0 1 21 6.5 V17.5 A2.5 2.5 0 0 1 18.5 20 H5.5 A2.5 2.5 0 0 1 3 17.5 V6.5 A2.5 2.5 0 0 1 5.5 4 M7 9 L10 12 L7 15 M13 15 H17"/>
  </g>
  <text data-fill-role="edge-ink" fill="#070707" x="358" y="145" font-size="15" font-weight="700" dominant-baseline="central">처음 여는 곳</text>
  <text data-fill-role="ink" fill="#070707" x="358" y="166" font-size="13" dominant-baseline="central">1단계에서 프롬프트를 보내요</text>

  <circle data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1" cx="334" cy="329" r="15"/>
  <g transform="translate(325 320) scale(0.75)">
    <path data-stroke-role="edge-line" stroke="#070707" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M5.5 4 H18.5 A2.5 2.5 0 0 1 21 6.5 V17.5 A2.5 2.5 0 0 1 18.5 20 H5.5 A2.5 2.5 0 0 1 3 17.5 V6.5 A2.5 2.5 0 0 1 5.5 4 M7 9 L10 12 L7 15 M13 15 H17"/>
  </g>
  <text data-fill-role="edge-ink" fill="#070707" x="358" y="319" font-size="15" font-weight="700" dominant-baseline="central">다시 여는 곳</text>
  <text data-fill-role="ink" fill="#070707" x="358" y="340" font-size="13" dominant-baseline="central">3단계에서 알려 준 한 줄로 열어요</text>
</svg>
