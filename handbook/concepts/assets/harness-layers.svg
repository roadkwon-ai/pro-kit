<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 502" width="800" height="502" role="img" style="font-family:Pretendard,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>하네스를 이루는 것</title>
  <desc>가운데 AI 에이전트를 규칙 문서, 스킬, 역할 나누기, 대조표와 audit, 자동 검사 다섯 층이 안쪽부터 차례로 감싸고 있어요.</desc>
