<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650" role="img" style="font-family:Pretendard,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>하네스를 이루는 것</title>
  <desc>가운데 AI 에이전트를 규칙 문서, 스킬, 역할 나누기, 대조표와 audit, 자동 검사 다섯 층이 안쪽부터 차례로 감싸고 있어요.</desc>
  <rect data-fill-role="canvas" fill="#F2F2F2" x="0" y="0" width="800" height="650"/>
  <rect data-fill-role="focus" fill="#070707" x="16" y="24" width="4" height="92" rx="2"/>
  <text data-fill-role="ink" fill="#070707" x="32" y="46" font-size="34" font-weight="700" dominant-baseline="central">하네스를 이루는 것</text>
  <text data-fill-role="muted" fill="#555555" x="32" y="94" font-size="25" dominant-baseline="central">에이전트는 가운데서 일하고, 바깥 층이 순서와 검사를 지켜요</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1" x="16" y="136" width="768" height="494" rx="14"/>
  <text data-fill-role="ink" fill="#070707" x="32" y="156" font-size="26" font-weight="700" dominant-baseline="central">자동 검사</text>
  <text data-fill-role="muted" fill="#555555" x="32" y="182" font-size="25" dominant-baseline="central">타입 · 린트 · 빌드 · 테스트 · 비밀값 · 배포 전</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#F7F7F7" stroke="#D9D9D9" stroke-width="1" x="28" y="198" width="744" height="420" rx="14"/>
  <text data-fill-role="ink" fill="#070707" x="44" y="218" font-size="26" font-weight="700" dominant-baseline="central">대조표와 audit</text>
  <text data-fill-role="muted" fill="#555555" x="44" y="244" font-size="25" dominant-baseline="central">케이스 판정 · 대조표 · 빈칸 검사</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1" x="40" y="260" width="720" height="346" rx="14"/>
  <text data-fill-role="ink" fill="#070707" x="56" y="280" font-size="26" font-weight="700" dominant-baseline="central">역할 나누기</text>
  <text data-fill-role="muted" fill="#555555" x="56" y="306" font-size="25" dominant-baseline="central">코디네이터 · 수행자 · 리뷰어 · 분석</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#F7F7F7" stroke="#D9D9D9" stroke-width="1" x="52" y="322" width="696" height="272" rx="14"/>
  <text data-fill-role="ink" fill="#070707" x="68" y="342" font-size="26" font-weight="700" dominant-baseline="central">스킬</text>
  <text data-fill-role="muted" fill="#555555" x="68" y="368" font-size="25" dominant-baseline="central">prokit-* 스킬과 공식 스킬</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1" x="64" y="384" width="672" height="198" rx="14"/>
  <text data-fill-role="ink" fill="#070707" x="80" y="404" font-size="26" font-weight="700" dominant-baseline="central">규칙 문서</text>
  <text data-fill-role="muted" fill="#555555" x="80" y="430" font-size="25" dominant-baseline="central">AGENTS.md · CLAUDE.md · GLOSSARY.md</text>
  <rect data-fill-role="surface-tint" data-stroke-role="edge-line" fill="#FFF4BE" stroke="#070707" stroke-width="1" x="76" y="446" width="648" height="124" rx="14"/>
  <text data-fill-role="ink" fill="#070707" x="400" y="488" font-size="32" font-weight="700" text-anchor="middle" dominant-baseline="central">AI 에이전트</text>
  <text data-fill-role="ink" fill="#070707" x="400" y="530" font-size="25" text-anchor="middle" dominant-baseline="central">Claude Code · Codex 같은 에이전트가 여기서 일해요</text>
