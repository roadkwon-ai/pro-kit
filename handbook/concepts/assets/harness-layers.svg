  <text data-fill-role="ink" fill="#070707" x="74" y="208" font-size="15" font-weight="700" dominant-baseline="central">역할 나누기</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="224" y="208" font-size="13" dominant-baseline="central">코디네이터 · 수행자 · 리뷰어 · 분석</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#F7F7F7" stroke="#E6E6E6" stroke-width="1" x="70" y="228" width="660" height="204" rx="16"/>
  <text data-fill-role="ink" fill="#070707" x="88" y="248" font-size="15" font-weight="700" dominant-baseline="central">스킬</text>
