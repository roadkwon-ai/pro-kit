  <rect data-fill-role="surface" data-stroke-role="rule" fill="#F7F7F7" stroke="#E6E6E6" stroke-width="1" x="42" y="148" width="716" height="312" rx="16"/>
  <text data-fill-role="ink" fill="#070707" x="60" y="168" font-size="15" font-weight="700" dominant-baseline="central">대조표와 audit</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="210" y="168" font-size="13" dominant-baseline="central">케이스 판정 · 대조표 · 빈칸이 없는지 검사</text>
