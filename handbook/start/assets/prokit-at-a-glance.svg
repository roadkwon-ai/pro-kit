  <path data-stroke-role="external-line" stroke="#6B6B6B" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#ah)" d="M530 296 H550"/>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1" x="556" y="114" width="232" height="364" rx="14"/>
  <text data-fill-role="ink" fill="#070707" x="572" y="140" font-size="16" font-weight="700" dominant-baseline="central">내가 받는 것</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1" x="568" y="193" width="208" height="52" rx="10"/>
  <text data-fill-role="ink" fill="#070707" x="580" y="210" font-size="15" font-weight="700" dominant-baseline="central">실행 증거가 남은 변경</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="580" y="230" font-size="13" dominant-baseline="central">명령과 결과가 대조표에 남아요</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1" x="568" y="255" width="208" height="52" rx="10"/>
  <text data-fill-role="ink" fill="#070707" x="580" y="272" font-size="15" font-weight="700" dominant-baseline="central">독립 리뷰</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="580" y="292" font-size="13" dominant-baseline="central">만든 쪽과 다른 에이전트가 봐요</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1" x="568" y="317" width="208" height="52" rx="10"/>
  <text data-fill-role="ink" fill="#070707" x="580" y="334" font-size="15" font-weight="700" dominant-baseline="central">내가 확인한 결과</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="580" y="354" font-size="13" dominant-baseline="central">마지막 확인은 내 몫이에요</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1" x="568" y="379" width="208" height="52" rx="10"/>
  <text data-fill-role="ink" fill="#070707" x="580" y="396" font-size="15" font-weight="700" dominant-baseline="central">커밋과 배포 준비</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="580" y="416" font-size="13" dominant-baseline="central">배포 전 검사를 통과해야 해요</text>
