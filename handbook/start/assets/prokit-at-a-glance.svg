  <text data-fill-role="ink" fill="#070707" x="316" y="241" font-size="15" font-weight="700" dominant-baseline="central">전용 스킬</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="316" y="261" font-size="13" dominant-baseline="central">prokit-* 스킬과 공식 스킬</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1" x="304" y="286" width="208" height="52" rx="10"/>
  <text data-fill-role="ink" fill="#070707" x="316" y="303" font-size="15" font-weight="700" dominant-baseline="central">역할 에이전트</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="316" y="323" font-size="13" dominant-baseline="central">수행 · 리뷰 · 분석</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1" x="304" y="348" width="208" height="52" rx="10"/>
  <text data-fill-role="ink" fill="#070707" x="316" y="365" font-size="15" font-weight="700" dominant-baseline="central">dev-cycle과 audit</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="316" y="385" font-size="13" dominant-baseline="central">케이스 · 대조표 · 빈칸 검사</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1" x="304" y="410" width="208" height="52" rx="10"/>
  <text data-fill-role="ink" fill="#070707" x="316" y="427" font-size="15" font-weight="700" dominant-baseline="central">자동 검사</text>
