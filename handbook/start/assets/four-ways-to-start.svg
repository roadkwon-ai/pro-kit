<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700" role="img" style="font-family:Pretendard,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>시작하는 네 가지 방법</title>
  <desc>새 프로젝트, 초기 프로젝트, 운영 중인 Next.js, 전환 네 카드로, 각각 어떤 때 쓰는지, 어디서 작업하는지, 먼저 하는 일을 보여 줘요. 기존 프로젝트는 동의하기 전에는 아무것도 바꾸지 않아요.</desc>
  <rect data-fill-role="canvas" fill="#F2F2F2" x="0" y="0" width="800" height="700"/>
  <defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect data-fill-role="focus" fill="#070707" x="28" y="28" width="3" height="38" rx="1.5"/>
  <text data-fill-role="ink" fill="#070707" x="41" y="47" font-size="22" font-weight="700" dominant-baseline="central">시작하는 네 가지 방법</text>
  <text data-fill-role="muted" fill="#6B6B6B" x="41" y="81" font-size="14" dominant-baseline="central">내 프로젝트가 어디까지 왔는지에 따라 골라요</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1" x="28" y="108" width="364" height="244" rx="14"/>
  <rect data-fill-role="focus" fill="#070707" x="44" y="122" width="3" height="22" rx="1.5"/>
  <text data-fill-role="ink" fill="#070707" x="56" y="133" font-size="18" font-weight="700" dominant-baseline="central">새 프로젝트</text>
  <rect data-fill-role="surface-tint" fill="#F7F7F7" x="40" y="160" width="340" height="52" rx="10"/>
  <text data-fill-role="muted" fill="#6B6B6B" x="52" y="186" font-size="13" font-weight="700" dominant-baseline="central">이럴 때</text>
  <text data-fill-role="ink" fill="#070707" x="120" y="186" font-size="15" dominant-baseline="central">아직 코드가 없어요(PRD 필수)</text>
  <rect data-fill-role="surface-tint" fill="#F7F7F7" x="40" y="220" width="340" height="52" rx="10"/>
  <text data-fill-role="muted" fill="#6B6B6B" x="52" y="246" font-size="13" font-weight="700" dominant-baseline="central">작업 위치</text>
  <text data-fill-role="ink" fill="#070707" x="120" y="246" font-size="15" dominant-baseline="central">pro-kit 옆의 새 폴더</text>
  <rect data-fill-role="surface-tint" fill="#FFF4BE" x="40" y="280" width="340" height="52" rx="10"/>
  <text data-fill-role="muted" fill="#6B6B6B" x="52" y="306" font-size="13" font-weight="700" dominant-baseline="central">먼저</text>
  <text data-fill-role="ink" fill="#070707" x="120" y="306" font-size="15" dominant-baseline="central">PRD를 받고 스킬 구성을 골라요</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1" x="408" y="108" width="364" height="244" rx="14"/>
  <rect data-fill-role="focus" fill="#070707" x="424" y="122" width="3" height="22" rx="1.5"/>
  <text data-fill-role="ink" fill="#070707" x="436" y="133" font-size="18" font-weight="700" dominant-baseline="central">초기 프로젝트</text>
  <rect data-fill-role="surface-tint" fill="#F7F7F7" x="420" y="160" width="340" height="52" rx="10"/>
  <text data-fill-role="muted" fill="#6B6B6B" x="432" y="186" font-size="13" font-weight="700" dominant-baseline="central">이럴 때</text>
  <text data-fill-role="ink" fill="#070707" x="500" y="186" font-size="15" dominant-baseline="central">기획 자료와 프로토타입만 있어요</text>
  <rect data-fill-role="surface-tint" fill="#F7F7F7" x="420" y="220" width="340" height="52" rx="10"/>
  <text data-fill-role="muted" fill="#6B6B6B" x="432" y="246" font-size="13" font-weight="700" dominant-baseline="central">작업 위치</text>
  <text data-fill-role="ink" fill="#070707" x="500" y="246" font-size="15" dominant-baseline="central">같은 폴더에서 적용해 합쳐요</text>
  <rect data-fill-role="surface-tint" fill="#FFF4BE" x="420" y="280" width="340" height="52" rx="10"/>
  <text data-fill-role="muted" fill="#6B6B6B" x="432" y="306" font-size="13" font-weight="700" dominant-baseline="central">먼저</text>
  <text data-fill-role="ink" fill="#070707" x="500" y="296" font-size="15" dominant-baseline="central">읽기만 하는 초기 분석부터,</text>
  <text data-fill-role="ink" fill="#070707" x="500" y="317" font-size="15" dominant-baseline="central">동의 뒤 프로토타입을 옮겨요</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1" x="28" y="368" width="364" height="244" rx="14"/>
  <rect data-fill-role="focus" fill="#070707" x="44" y="382" width="3" height="22" rx="1.5"/>
  <text data-fill-role="ink" fill="#070707" x="56" y="393" font-size="18" font-weight="700" dominant-baseline="central">운영 중인 Next.js</text>
  <rect data-fill-role="surface-tint" fill="#F7F7F7" x="40" y="420" width="340" height="52" rx="10"/>
  <text data-fill-role="muted" fill="#6B6B6B" x="52" y="446" font-size="13" font-weight="700" dominant-baseline="central">이럴 때</text>
  <text data-fill-role="ink" fill="#070707" x="120" y="446" font-size="15" dominant-baseline="central">개발하고 운영 중이에요</text>
  <rect data-fill-role="surface-tint" fill="#F7F7F7" x="40" y="480" width="340" height="52" rx="10"/>
  <text data-fill-role="muted" fill="#6B6B6B" x="52" y="506" font-size="13" font-weight="700" dominant-baseline="central">작업 위치</text>
  <text data-fill-role="ink" fill="#070707" x="120" y="506" font-size="15" dominant-baseline="central">같은 폴더의 새 브랜치</text>
  <rect data-fill-role="surface-tint" fill="#FFF4BE" x="40" y="540" width="340" height="52" rx="10"/>
  <text data-fill-role="muted" fill="#6B6B6B" x="52" y="566" font-size="13" font-weight="700" dominant-baseline="central">먼저</text>
  <text data-fill-role="ink" fill="#070707" x="120" y="556" font-size="15" dominant-baseline="central">읽기만 하는 초기 분석부터,</text>
  <text data-fill-role="ink" fill="#070707" x="120" y="577" font-size="15" dominant-baseline="central">앱 코드는 바꾸지 않아요</text>
  <rect data-fill-role="surface" data-stroke-role="rule" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1" x="408" y="368" width="364" height="244" rx="14"/>
  <rect data-fill-role="focus" fill="#070707" x="424" y="382" width="3" height="22" rx="1.5"/>
  <text data-fill-role="ink" fill="#070707" x="436" y="393" font-size="18" font-weight="700" dominant-baseline="central">전환</text>
  <rect data-fill-role="surface-tint" fill="#F7F7F7" x="420" y="420" width="340" height="52" rx="10"/>
  <text data-fill-role="muted" fill="#6B6B6B" x="432" y="446" font-size="13" font-weight="700" dominant-baseline="central">이럴 때</text>
  <text data-fill-role="ink" fill="#070707" x="500" y="446" font-size="15" dominant-baseline="central">PHP · Django 같은 다른 스택이에요</text>
  <rect data-fill-role="surface-tint" fill="#F7F7F7" x="420" y="480" width="340" height="52" rx="10"/>
  <text data-fill-role="muted" fill="#6B6B6B" x="432" y="506" font-size="13" font-weight="700" dominant-baseline="central">작업 위치</text>
  <text data-fill-role="ink" fill="#070707" x="500" y="506" font-size="15" dominant-baseline="central">새 폴더(기존 코드는 읽기만)</text>
  <rect data-fill-role="surface-tint" fill="#FFF4BE" x="420" y="540" width="340" height="52" rx="10"/>
  <text data-fill-role="muted" fill="#6B6B6B" x="432" y="566" font-size="13" font-weight="700" dominant-baseline="central">먼저</text>
  <text data-fill-role="ink" fill="#070707" x="500" y="556" font-size="15" dominant-baseline="central">읽기만 하는 초기 분석부터,</text>
  <text data-fill-role="ink" fill="#070707" x="500" y="577" font-size="15" dominant-baseline="central">새 폴더에 Next.js를 만들어요</text>
  <rect data-fill-role="surface-tint" fill="#FFF4BE" x="28" y="628" width="744" height="44" rx="12"/>
  <text data-fill-role="ink" fill="#070707" x="400" y="650" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">기존 프로젝트는 동의하기 전에는 아무것도 바꾸지 않아요</text>
</svg>
